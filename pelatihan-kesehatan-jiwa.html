<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pelatihan KB</title>

    <link rel="stylesheet" href="gallery.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <a href="dokumentasi.html" class="back">
            ← Kembali
        </a>

        <h1>Pelatihan Kesehatan Jiwa</h1>

        <p>Dokumentasi Pelatihan Kesehatan Jiwa</p>

    </header>


    <!-- PHOTO GALLERY -->

    <main class="photo-gallery">


        <img
            src="jiwa-1.jpg"
            alt="Kegiatan F - Foto 1"
            onclick="openPhoto(this)"
        >


        <img
            src="jiwa-2.jpg"
            alt="Kegiatan F - Foto 2"
            onclick="openPhoto(this)"
        >


        <img
            src="jiwa-3.jpg"
            alt="Kegiatan F - Foto 3"
            onclick="openPhoto(this)"
        >

         
    </main>


    <!-- FULLSCREEN PHOTO VIEWER -->

    <div id="photo-viewer" onclick="closePhoto()">

        <span class="close">
            ×
        </span>

        <img id="large-photo" src="" alt="">

    </div>


    <!-- JAVASCRIPT -->

    <script>

        function openPhoto(photo) {

            document.getElementById("photo-viewer").style.display = "flex";

            document.getElementById("large-photo").src = photo.src;

        }


        function closePhoto() {

            document.getElementById("photo-viewer").style.display = "none";

        }

    </script>

</body>

</html>
